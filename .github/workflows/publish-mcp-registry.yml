name: Publish to MCP Registry

# Publishes aibvf-mcp to npm (with provenance) AND server.json to the MCP registry.
# Triggers on version bumps (server.json or packages/mcp/package.json change on main),
# or on manual workflow_dispatch.
#
# If the npm version already exists, the npm publish step is skipped.
# If the MCP registry version already exists, the registry publish treats it as success.
# That makes the workflow idempotent across re-runs and safe to trigger manually.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-mcp-registry.yml'
      - 'server.json'
      - 'packages/mcp/package.json'
      - 'packages/js/package.json'
      - 'packages/cli/package.json'
  workflow_dispatch:

permissions:
  id-token: write   # required for GitHub OIDC + npm provenance attestation
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Run tests before publishing
        run: npm test

      - name: Verify release contract and worked example
        run: |
          node scripts/check-release-contract.mjs
          node scripts/check-worked-example.mjs

      # Publish the shared engine before packages that depend on its new version.
      - name: Read @aibvf/core version before dependants
        id: corepkg_before
        run: |
          CV=$(node -p "require('./packages/js/package.json').version")
          echo "version=$CV" >> "$GITHUB_OUTPUT"
          echo "@aibvf/core version on disk: $CV"

      - name: Check @aibvf/core before dependants
        id: core_check_before
        run: |
          if npm view "@aibvf/core@${{ steps.corepkg_before.outputs.version }}" version --prefer-online > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "@aibvf/core@${{ steps.corepkg_before.outputs.version }} already on npm, skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish @aibvf/core before dependants
        if: steps.core_check_before.outputs.exists == 'false'
        working-directory: packages/js
        run: |
          echo "Publishing @aibvf/core@${{ steps.corepkg_before.outputs.version }} with npm $(npm --version)"
          npm publish --provenance --access public
          echo "Published @aibvf/core@${{ steps.corepkg_before.outputs.version }} to npm"

      - name: Wait for core package propagation
        run: |
          for attempt in {1..30}; do
            if npm view "@aibvf/core@${{ steps.corepkg_before.outputs.version }}" version --prefer-online > /dev/null 2>&1; then
              npm view "@aibvf/core@${{ steps.corepkg_before.outputs.version }}" dist --json
              exit 0
            fi
            sleep 10
          done
          echo "The core package did not become visible on npm"
          exit 1

      - name: Read package version
        id: pkg
        run: |
          VERSION=$(node -p "require('./packages/mcp/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "aibvf-mcp version on disk: $VERSION"

      - name: Check if version is on npm
        id: npm-check
        run: |
          if npm view "aibvf-mcp@${{ steps.pkg.outputs.version }}" version --prefer-online > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.pkg.outputs.version }} already on npm, will skip npm publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.pkg.outputs.version }} not on npm, will publish"
          fi

      - name: Publish to npm with provenance
        # Auth via GitHub OIDC trusted publishing (no token). npm >= 11.5 exchanges
        # the id-token for a short-lived publish credential; provenance via id-token: write.
        if: steps.npm-check.outputs.exists == 'false'
        working-directory: packages/mcp
        run: |
          echo "Publishing aibvf-mcp@${{ steps.pkg.outputs.version }} with npm $(npm --version)"
          npm publish --provenance --access public
          echo "✅ Published aibvf-mcp@${{ steps.pkg.outputs.version }} to npm"

      - name: Wait for npm registry propagation
        run: |
          for attempt in {1..30}; do
            if npm view "aibvf-mcp@${{ steps.pkg.outputs.version }}" version --prefer-online > /dev/null 2>&1; then
              echo "aibvf-mcp@${{ steps.pkg.outputs.version }} is visible on npm"
              exit 0
            fi
            echo "npm has not exposed the new version yet, retrying in 10 seconds"
            sleep 10
          done
          echo "aibvf-mcp@${{ steps.pkg.outputs.version }} did not become visible on npm"
          exit 1

      - name: Read aibvf-check version
        id: clipkg
        run: |
          CLIV=$(node -p "require('./packages/cli/package.json').version")
          echo "version=$CLIV" >> "$GITHUB_OUTPUT"
          echo "aibvf-check version on disk: $CLIV"

      - name: Check if aibvf-check version is on npm
        id: cli-check
        run: |
          if npm view "aibvf-check@${{ steps.clipkg.outputs.version }}" version --prefer-online > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "aibvf-check@${{ steps.clipkg.outputs.version }} already on npm, skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish aibvf-check with provenance
        if: steps.cli-check.outputs.exists == 'false'
        working-directory: packages/cli
        run: |
          echo "Publishing aibvf-check@${{ steps.clipkg.outputs.version }} with npm $(npm --version)"
          npm publish --provenance --access public
          echo "✅ Published aibvf-check@${{ steps.clipkg.outputs.version }} to npm"

      - name: Download mcp-publisher
        run: |
          curl -L -o publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz
          tar -xzf publisher.tar.gz
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: Login with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to MCP Registry
        run: |
          for attempt in 1 2 3; do
            set +e
            OUTPUT=$(./mcp-publisher publish 2>&1)
            EXIT_CODE=$?
            set -e
            echo "$OUTPUT"
            if [ $EXIT_CODE -eq 0 ]; then
              echo "::notice::MCP registry publish succeeded"
              exit 0
            fi
            if echo "$OUTPUT" | grep -q "duplicate version"; then
              echo "::notice::Version ${{ steps.pkg.outputs.version }} already in MCP registry, treating as success"
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              echo "MCP registry publish failed, retrying in 15 seconds"
              sleep 15
            fi
          done
          exit $EXIT_CODE

      - name: Confirm listing
        run: |
          sleep 5
          curl -s "https://registry.modelcontextprotocol.io/v0/servers?search=aibvf" \
            | head -c 1000

  release-notes:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Prepare release notes
        id: release
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const mcp = require('./packages/mcp/package.json').version;
          const core = require('./packages/js/package.json').version;
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const section = changelog.split(/^## /m)[1];
          if (!section || !section.includes(mcp) || !section.includes(core)) {
            throw new Error('The latest changelog section must name both package versions.');
          }
          fs.writeFileSync('release-notes.md', section.slice(section.indexOf('\n') + 1).trim() + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'tag=v' + mcp + '\nname=AI BVF MCP ' + mcp + ' / core ' + core + '\n');
          NODE
      - name: Publish GitHub release after package verification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NAME: ${{ steps.release.outputs.name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_NAME" --notes-file release-notes.md
          fi
