name: Test
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Build packages
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Verify published worked example
        run: node scripts/check-worked-example.mjs

      - name: Verify release metadata and tool catalogue
        run: node scripts/check-release-contract.mjs

      - name: Verify the agent skill matches the operating brief
        run: node scripts/build-agent-skill.mjs --check

      - name: Verify the deep dive script counts the example log
        run: node --test skills/aibvf-deep-dive/scripts/measure.test.mjs

      - name: Verify the shared expected results match the TypeScript engine
        run: node scripts/build-parity-vectors.mjs --check

      - name: Verify the Python engine gives the same results
        run: python3 -m unittest discover -s packages/py/tests -v
