name: Publish to PyPI

# Publishes the aibvf Python package through PyPI trusted publishing (GitHub OIDC, no token).
# Triggers when packages/py/pyproject.toml changes on main, or on manual workflow_dispatch.
#
# One-time setup on pypi.org, project aibvf, Publishing, Add a trusted publisher:
#   Owner: Craig-Horton   Repository: ai-bvf   Workflow: publish-pypi.yml   Environment: (leave empty)
#
# A version already on PyPI is skipped, so re-runs are safe.

on:
  push:
    branches: [main]
    paths:
      - 'packages/py/pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build packages/py --outdir dist
          python -m twine check dist/*
      - name: Smoke-test the built wheel outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          python - <<'PY'
          import aibvf
          assert aibvf.load_schema(), 'bundled schema did not load'
          result = aibvf.score(
              industry='retail', revenue_eur=50_000_000, function='cx', ai_tier='gen2', readiness='traditional',
              scores={'strategic_alignment': 70, 'financial_return': 65, 'change_enablement': 55, 'governance_risk': 30},
          )
          assert result['classification'] in ('Accelerate', 'Fix', 'Stop'), result
          print('aibvf wheel OK:', result['classification'])
          PY
      - name: Check the package against the shared expected results before it is published
        run: python -m unittest discover -s packages/py/tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
