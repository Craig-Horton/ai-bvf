name: Adoption cumulative snapshot (public metrics only)
on:
  push:
    branches: [ops/adoption-snapshot-20261003-rerun]
    paths: [.github/workflows/adoption-snapshot-rerun.yml]
permissions:
  contents: read
jobs:
  public-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query cumulative npm downloads through the last registry-reported day
        shell: bash
        run: |
          node --input-type=module <<'ADOPTION_SNAPSHOT'
          const end = '2026-10-01'; // Registry-reported last available day from preceding snapshot.
          const cumulative = await Promise.all(['@aibvf/core','aibvf-mcp','aibvf-check'].map(async packageName => {
            const metadataUrl = 'https://registry.npmjs.org/' + encodeURIComponent(packageName);
            const metadataResponse = await fetch(metadataUrl);
            if (!metadataResponse.ok) throw new Error('Metadata HTTP ' + metadataResponse.status);
            const metadata = await metadataResponse.json();
            const start=metadata.time.created.slice(0,10);
            const url='https://api.npmjs.org/downloads/point/'+start+':'+end+'/'+encodeURIComponent(packageName);
            const response = await fetch(url);
            if (!response.ok) throw new Error('Downloads HTTP ' + response.status);
            const result=await response.json();
            if (result.start !== start || result.end !== end || !Number.isSafeInteger(result.downloads)) throw new Error('Invalid downloads response');
            return {package:packageName,created:metadata.time.created,latest:metadata['dist-tags']?.latest,url,...result};
          }));
          console.log(JSON.stringify({requestedAt:new Date().toISOString(),cumulative,totalRawRetrievals:cumulative.reduce((sum,item)=>sum+item.downloads,0)},null,2));
          console.log('These counts include repeat installs, dependencies and automation. They are not unique people.');
          
          ADOPTION_SNAPSHOT
